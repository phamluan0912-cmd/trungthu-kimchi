<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minh Luân ❤️ Kim Chi | Trung Thu</title>

<style>
body{
margin:0;
padding:0;
height:100vh;
overflow:hidden;
font-family:Segoe UI,sans-serif;
background:linear-gradient(#08142f,#1f3f9c);
color:white;
display:flex;
justify-content:center;
align-items:center;
}

.card{
width:90%;
max-width:900px;
text-align:center;
padding:30px;
background:rgba(255,255,255,.1);
border-radius:30px;
backdrop-filter:blur(10px);
}

h1{
color:#FFD86B;
font-size:42px;
}

.names{
font-size:32px;
font-weight:bold;
margin:20px 0;
}

.heart{
font-size:90px;
animation:beat 1s infinite;
}

@keyframes beat{
50%{transform:scale(1.2);}
}

button{
padding:12px 25px;
border:none;
border-radius:15px;
background:#FFD86B;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h1>🌕 Chúc Mừng Trung Thu 🌕</h1>

<div class="names">
Minh Luân ❤️ Kim Chi
</div>

<div class="heart">
❤️
</div>

<p>
Dưới ánh trăng rằm lung linh, chúc Minh Luân và Kim Chi
luôn hạnh phúc, yêu thương và đồng hành cùng nhau
qua thật nhiều mùa Trung Thu nữa.
</p>

<br>

<button onclick="playMusic()">
🎵 Phát nhạc Thằng Cuội
</button>

<audio id="bgMusic" loop>
  music.mp3
</audio>

</div>

<script>
function playMusic(){
document.getElementById('bgMusic').play();
}
</script>

</body>
</html>
